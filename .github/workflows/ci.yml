name: Validate source and CPU runtime

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: Build tools and source checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test build tools
        run: python -m unittest discover -s tests/unit -v
      - name: Verify public gallery recipes and audio
        run: python scripts/verify_gallery.py
      - name: Verify official GGML pin and license
        run: python scripts/verify_ggml_source.py
  website:
    name: Build and check documentation website
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build site and verify routes, media and output boundaries
        run: python scripts/pages.py test
  web:
    name: Check and build web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js and npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Test UI request behavior
        run: npm test
      - name: Check web formatting
        run: npm run lint
      - name: Build web UI
        run: npm run build
  cpu:
    name: Build and check native executables
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build CPU executables and check startup
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: cpu-checks
          push: false
          cache-from: type=gha,scope=yue2-cpu
          cache-to: type=gha,scope=yue2-cpu,mode=max
          build-args: SOURCE_REVISION=${{ github.sha }}
