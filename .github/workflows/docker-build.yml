name: Build CUDA container

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build to GHCR
        type: boolean
        default: false
      image_tag:
        description: Container tag for a manual build
        type: string
        default: latest

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'hangry-labs/yue2'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: yue2-container-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify source and publication rules
        run: |
          python3 -m unittest discover -s tests/unit -v
          python3 scripts/verify_vendor.py
      - name: Plan one image variant
        id: plan
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: python3 scripts/ci_images.py
      - name: Select matching GGML dependency artifact
        id: deps
        run: python3 scripts/ggml_deps.py plan
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: steps.plan.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: ${{ steps.plan.outputs.publish == 'true' }}
          tags: ${{ steps.plan.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=yue2-cuda
            type=gha,scope=yue2-ggml
          cache-to: type=gha,scope=yue2-cuda,mode=max
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            BUILD_JOBS=2
            CUDA_BASE=${{ steps.deps.outputs.cuda_base }}
            CUDA_ARCHITECTURES=${{ steps.deps.outputs.architectures }}
            GGML_DEPS_IMAGE=${{ steps.deps.outputs.image }}
