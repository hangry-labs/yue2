name: Build and publish CUDA image

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional existing stable Git tag, such as v0.1.0
        type: string
        required: false
      checkout_ref:
        description: Optional ref to build; defaults to image_tag or the selected workflow ref
        type: string
        required: false
      push_latest:
        description: Also publish the rolling latest tag to Docker Hub and GHCR
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build and publish CUDA image
    if: github.repository == 'hangry-labs/yue2'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: yue2-container-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || inputs.image_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test build tools
        run: python3 -m unittest discover -s tests/unit -v
      - name: Verify native dependency pins and licenses
        run: |
          python3 scripts/verify_ggml_source.py
          python3 scripts/verify_app_deps.py
      - name: Choose image tag and publishing settings
        id: plan
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_PUSH_LATEST: ${{ github.event_name != 'workflow_dispatch' || inputs.push_latest }}
        run: python3 scripts/ci_images.py
      - name: Check Docker Hub credentials are configured
        if: steps.plan.outputs.publish == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          if [[ -z "$DOCKER_USERNAME" || -z "$DOCKER_TOKEN" ]]; then
            echo "::error::Configure DOCKER_USERNAME and DOCKER_TOKEN with push access to hangrylabs/yue2."
            exit 1
          fi
      - name: Download and verify prebuilt GGML libraries
        id: deps
        run: python3 scripts/ggml_release.py prepare --cache-dir "$RUNNER_TEMP/yue2-ggml"
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Sign in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: steps.plan.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: steps.plan.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check stable image tags have not been published
        if: steps.plan.outputs.publish == 'true'
        run: python3 scripts/ci_images.py --check-existing
      - name: ${{ steps.plan.outputs.publish == 'true' && 'Build and publish CUDA image' || 'Build CUDA image' }}
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          build-contexts: ${{ steps.deps.outputs.context }}
          target: runtime
          platforms: linux/amd64
          push: ${{ steps.plan.outputs.publish == 'true' }}
          tags: ${{ steps.plan.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=registry,ref=hangrylabs/yue2:latest
            type=registry,ref=ghcr.io/hangry-labs/yue2:latest
          cache-to: type=inline
          build-args: |
            SOURCE_REVISION=${{ steps.plan.outputs.revision }}
            BUILD_JOBS=2
            CUDA_BASE=${{ steps.deps.outputs.cuda_base }}
            CUDA_ARCHITECTURES=${{ steps.deps.outputs.architectures }}
            GGML_DEPS_IMAGE=${{ steps.deps.outputs.image }}
      - name: Verify both registries contain the same image
        if: steps.plan.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 scripts/ci_images.py --verify
      - name: Verify public pull access to both registries
        if: steps.plan.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 scripts/ci_images.py --verify-public
      - name: Save publication plan and verification reports
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/publication/
          if-no-files-found: error
          retention-days: 30
