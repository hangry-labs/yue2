name: Prepare GGML CUDA dependency

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the dependency artifact to GHCR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency:
    name: Build reusable GGML libraries
    if: github.repository == 'hangry-labs/yue2'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: yue2-ggml-dependency
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test build tools
        run: python3 -m unittest discover -s tests/unit -v
      - name: Verify native dependency pins and licenses
        run: |
          python3 scripts/verify_ggml_source.py
          python3 scripts/verify_app_deps.py
      - name: Calculate GGML build fingerprint
        id: deps
        run: python3 scripts/ggml_deps.py plan
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ${{ inputs.publish && 'Build and publish GGML libraries' || 'Build GGML libraries' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ggml-deps
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: ghcr.io/hangry-labs/yue2-ggml:${{ steps.deps.outputs.key }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=yue2-ggml
            type=gha,scope=yue2-cuda
          cache-to: type=gha,scope=yue2-ggml,mode=max
          build-args: |
            CUDA_BASE=${{ steps.deps.outputs.cuda_base }}
            CUDA_ARCHITECTURES=${{ steps.deps.outputs.architectures }}
            BUILD_JOBS=2
      - name: Write GGML build summary
        env:
          DEPENDENCY_KEY: ${{ steps.deps.outputs.key }}
          DEPENDENCY_DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED: ${{ inputs.publish }}
        run: |
          echo "Dependency input key: $DEPENDENCY_KEY" >> "$GITHUB_STEP_SUMMARY"
          echo "Published: $PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DEPENDENCY_DIGEST" >> "$GITHUB_STEP_SUMMARY"
