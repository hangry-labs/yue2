version: '3'

dotenv: ['.env']

vars:
  PYTHON: python
  IMAGE: '{{.YUE2_IMAGE | default "yue2:dev"}}'
  CONTAINER: '{{.YUE2_CONTAINER | default "yue2-dev"}}'
  PORT: '{{.YUE2_PORT | default "8087"}}'
  BIND_ADDRESS: '{{.YUE2_BIND_ADDRESS | default "127.0.0.1"}}'
  GPU_DEVICE: '{{.YUE2_GPU_DEVICE | default "all"}}'
  CUDA_ARCHITECTURES: '{{.YUE2_CUDA_ARCHITECTURES | default "auto"}}'
  BUILD_JOBS: '{{.YUE2_BUILD_JOBS | default "4"}}'
  GGML_DEPS_IMAGE: '{{.YUE2_GGML_DEPS_IMAGE | default ""}}'
  ASR_URL: '{{.YUE2_ASR_URL | default ""}}'
  LM_SEED: '831001'
  SEED: '831001'

env:
  YUE2_TASK_IMAGE: '{{.IMAGE}}'
  YUE2_TASK_CONTAINER: '{{.CONTAINER}}'
  YUE2_TASK_PORT: '{{.PORT}}'
  YUE2_TASK_BIND_ADDRESS: '{{.BIND_ADDRESS}}'
  YUE2_TASK_GPU_DEVICE: '{{.GPU_DEVICE}}'
  YUE2_TASK_CUDA_ARCHITECTURES: '{{.CUDA_ARCHITECTURES}}'
  YUE2_TASK_BUILD_JOBS: '{{.BUILD_JOBS}}'
  YUE2_TASK_GGML_DEPS_IMAGE: '{{.GGML_DEPS_IMAGE}}'

tasks:
  default:
    desc: List available tasks
    cmds: ['task --list']
  pages-build:
    desc: Build the README website and song gallery with the shared theme
    cmds: ['"{{.PYTHON}}" scripts/pages.py build']
  pages:
    desc: Preview the project website at http://127.0.0.1:9005/yue2/
    cmds: ['"{{.PYTHON}}" scripts/pages.py preview']
  pages-test:
    desc: Build and check website routes, public files and gallery integrity
    cmds: ['"{{.PYTHON}}" scripts/pages.py test']
  pages-stop:
    desc: Stop only this project website preview container
    cmds: ['"{{.PYTHON}}" scripts/pages.py stop']
  examples-generate:
    desc: Generate public demo songs in an isolated CUDA container
    cmds: ['"{{.PYTHON}}" scripts/generate_gallery.py --image "{{.IMAGE}}" {{.CLI_ARGS}}']
  examples-verify:
    desc: Verify published sample recipes, definitions and media checksums
    cmds: ['"{{.PYTHON}}" scripts/verify_gallery.py']
  examples-convert:
    desc: Verify or refresh the single Ogg Opus gallery export without inference
    cmds: ['"{{.PYTHON}}" scripts/convert_gallery.py']
  audio-convert:
    desc: Convert local audio to Opus, Ogg, MP3, FLAC, WAV or AAC (pass input output --format)
    cmds: ['"{{.PYTHON}}" scripts/audio_formats.py {{.CLI_ARGS}}']
  doctor:
    desc: Check the Docker engine, build tools and NVIDIA GPU
    cmds: ['"{{.PYTHON}}" scripts/dev.py doctor']
  init:
    desc: Verify/download external models and build the local CUDA image
    cmds:
      - task: models
      - task: build
  models:
    desc: Download or verify the two pinned GGUFs outside the image
    cmds: ['"{{.PYTHON}}" scripts/download_models.py']
  data:status:
    desc: Show local data paths and any legacy directories
    cmds: ['"{{.PYTHON}}" scripts/storage.py status']
  data:migrate:
    desc: Move legacy local data into data/ without overwriting or moving live mounts
    cmds: ['"{{.PYTHON}}" scripts/storage.py migrate']
  build:
    desc: Build the CUDA runtime with current UI and persistent compiler caches
    cmds: ['"{{.PYTHON}}" scripts/dev.py build']
  deps:build:
    desc: Prebuild reusable GGML libraries for all distribution CUDA targets
    cmds: ['"{{.PYTHON}}" scripts/dev.py deps-build']
  deps:plan:
    desc: Show the dependency fingerprint and selected CI artifact
    cmds: ['"{{.PYTHON}}" scripts/ggml_release.py plan']
  deps:prepare:
    desc: Download and verify the pinned public GGML release archive
    cmds: ['"{{.PYTHON}}" scripts/ggml_release.py prepare']
  deps:verify:
    desc: Verify native dependency source pins and retained licenses
    cmds:
      - '"{{.PYTHON}}" scripts/verify_ggml_source.py'
      - '"{{.PYTHON}}" scripts/verify_app_deps.py'
  deps:export:
    desc: Export the local GGML artifact and checksum for a GitHub Release upload
    cmds: ['"{{.PYTHON}}" scripts/ggml_release.py export']
  start:
    desc: Start or replace this project server with upstream runtime defaults
    cmds: ['"{{.PYTHON}}" scripts/dev.py start']
  stop:
    desc: Stop this project server without deleting models or browser data
    cmds: ['"{{.PYTHON}}" scripts/dev.py stop']
  status:
    desc: Inspect this project server
    cmds: ['"{{.PYTHON}}" scripts/dev.py status']
  logs:
    desc: Follow this project server logs
    cmds: ['"{{.PYTHON}}" scripts/dev.py logs']
  test:
    desc: Run CPU-only tooling tests and verify native dependency pins
    cmds:
      - '"{{.PYTHON}}" -m unittest discover -s tests/unit -v'
      - task: deps:verify
  test1:
    desc: Run the fixed-seed 8-step music baseline in Docker
    cmds: ['"{{.PYTHON}}" tests/benchmarks/test1.py --image "{{.IMAGE}}" --lm-seed "{{.LM_SEED}}" --seed "{{.SEED}}"']
  benchmark:
    desc: Run the resident-model speed, VRAM and four-language lyric baseline
    cmds: [{task: benchmark-baseline}]
  benchmark-plan:
    desc: Show the fixed benchmark workload without network or GPU execution
    cmds: ['"{{.PYTHON}}" -m benchmarks.run plan {{.CLI_ARGS}}']
  benchmark-preflight:
    desc: Check the selected image, model hashes, GPU tools and remote ASR judge
    env:
      YUE2_BENCHMARK_ASR_URL: '{{.ASR_URL}}'
    cmds: ['"{{.PYTHON}}" -m benchmarks.run preflight {{.CLI_ARGS}}']
  benchmark-smoke:
    desc: Run one English warmup and measured song without updating public reports
    env:
      YUE2_BENCHMARK_ASR_URL: '{{.ASR_URL}}'
    cmds: ['"{{.PYTHON}}" -m benchmarks.run run --pause-dev --languages en --repeats 1 {{.CLI_ARGS}}']
  benchmark-baseline:
    desc: Run four-language cold/warm benchmarks and refresh reviewed metric reports
    env:
      YUE2_BENCHMARK_ASR_URL: '{{.ASR_URL}}'
    cmds: ['"{{.PYTHON}}" -m benchmarks.run run --pause-dev --write-reports {{.CLI_ARGS}}']
  benchmark-score:
    desc: Rescore an existing run through ASR without regenerating songs
    env:
      YUE2_BENCHMARK_ASR_URL: '{{.ASR_URL}}'
    cmds: ['"{{.PYTHON}}" -m benchmarks.run score {{.CLI_ARGS}}']
  benchmark-compare:
    desc: Compare matched before/after run.json files and fail on regressions
    cmds: ['"{{.PYTHON}}" -m benchmarks.reports {{.CLI_ARGS}}']
  benchmark-test:
    desc: Test benchmark scoring, timing, isolation and regression checks without a GPU
    cmds: ['"{{.PYTHON}}" -m unittest discover -s tests/unit -p test_benchmarks.py -v']
  test:api:
    desc: Check capabilities and GPU telemetry against the running local server
    env:
      YUE2_TEST_URL: 'http://127.0.0.1:{{.PORT}}'
    cmds: ['"{{.PYTHON}}" -m unittest discover -s tests/integration -v']
  test1:prepare:
    desc: Prepare the baseline request without using Docker or a GPU
    cmds: ['"{{.PYTHON}}" tests/benchmarks/test1.py --prepare-only --lm-seed "{{.LM_SEED}}" --seed "{{.SEED}}"']
  check:cpu:
    desc: Build all native targets and check executable startup inside Docker
    cmds: ['"{{.PYTHON}}" scripts/dev.py cpu-check']
  vendor:verify:
    desc: Compatibility alias for deps:verify
    cmds: [{task: 'deps:verify'}]
  web:check:
    desc: Check Svelte, TypeScript and formatting in a Node container
    cmds: ['"{{.PYTHON}}" scripts/dev.py web-check']
  assets:build:
    desc: Regenerate product WebP artwork from PNG sources using FFmpeg
    cmds: ['"{{.PYTHON}}" scripts/convert_assets.py']
  web:build:
    desc: Rebuild the embedded UI asset in a Node container
    cmds: ['"{{.PYTHON}}" scripts/dev.py web-build']
  validate:
    desc: Run tooling tests, dependency pin verification, UI checks and native CPU checks
    cmds:
      - task: test
      - task: web:check
      - task: check:cpu
